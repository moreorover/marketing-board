name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  op:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load secret
        id: load_secrets
        uses: 1password/load-secrets-action@v3
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          USERNAME: op://marketing-dev/better-auth/username
          PASSWORD: op://marketing-dev/better-auth/password

      - name: Write mock secret to file (RAW)
        shell: bash
        env:
          USERNAME: ${{ steps.load_secrets.outputs.USERNAME }}
          PASSWORD: ${{ steps.load_secrets.outputs.PASSWORD }}
        run: |
          # Use printf to avoid trailing newline differences
          printf %s "PASSWORD" > mock-secret.txt
          echo "Wrote mock-secret.txt (size: $(stat -c%s mock-secret.txt) bytes)"

      - name: Upload artifact (mock secret)
        uses: actions/upload-artifact@v4
        with:
          name: mock-secret
          path: mock-secret.txt
          retention-days: 1
